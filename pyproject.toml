[project]
name = "whatsapp-kb"
version = "0.1.0"
description = "Grounded WhatsApp replies from local files"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "whatsapp-kb contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pyyaml>=6",
  "pypdf>=5",
  "openpyxl>=3.1",
  "fastembed>=0.4",
  "numpy>=2",
]

[project.optional-dependencies]
cursor = ["cursor-sdk>=1.3.1"]
dev = ["pytest>=8"]

[project.scripts]
whatsapp-kb = "whatsapp_kb.cli:main"

[project.entry-points."whatsapp_kb.sources"]
pdf = "whatsapp_kb.sources.pdf:PdfSource"
xlsx = "whatsapp_kb.sources.xlsx:XlsxSource"

[project.entry-points."whatsapp_kb.guards"]
amounts = "whatsapp_kb.answer.guards:AmountGuard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
